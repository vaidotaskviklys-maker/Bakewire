name: Test BAKEWIRE build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        publication_ready: ['false', 'true']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check site.mjs
          node --check site-v2.mjs
          node --check scripts/check.mjs
          node --check scripts/finalize.mjs
      - name: Build and validate
        env:
          PUBLICATION_READY: ${{ matrix.publication_ready }}
        run: npm run build
      - name: Check Cloudflare Pages headers
        run: |
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/rss.xml
