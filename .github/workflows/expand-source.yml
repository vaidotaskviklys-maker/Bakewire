name: Install BAKEWIRE source
on:
  push:
    paths:
      - 'bootstrap/site.bundle.br.b64'
      - '.github/workflows/expand-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand editable source files
        run: node bootstrap/install-source.mjs
      - name: Commit BAKEWIRE project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Add BAKEWIRE magazine source, content and illustrations"
            git push
          fi
